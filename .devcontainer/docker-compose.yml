name: docsync-wp-devcontainer

services:
  wordpress:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_USER: wordpress
      WP_ADMIN_EMAIL: admin@example.test
      WP_ADMIN_PASSWORD: password
      WP_ADMIN_USER: admin
      WP_HOME: http://localhost:8888
    ports:
      - "8888:80"
    volumes:
      - wordpress_data:/var/www/html
      - ..:/var/www/html/wp-content/plugins/brasth-document-sync-for-google-docs:cached
      - ./php/conf.d/docsync-dev.ini:/usr/local/etc/php/conf.d/docsync-dev.ini:ro

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: wordpress
      MYSQL_USER: wordpress
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uwordpress -pwordpress --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"

volumes:
  db_data:
  wordpress_data:
