name: docsync-wp-devcontainer

services:
  wordpress:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_USER: wordpress
      WP_ADMIN_EMAIL: admin@example.test
      WP_ADMIN_PASSWORD: password
      WP_ADMIN_USER: admin
      WP_HOME: http://localhost:8890
    ports:
      - "8890:80"
    volumes:
      - wordpress_data:/var/www/html
      - ..:/var/www/html/wp-content/plugins/brasth-document-sync-for-google-docs:cached
      - plugin_node_modules:/var/www/html/wp-content/plugins/brasth-document-sync-for-google-docs/node_modules
      - plugin_pnpm_store:/var/www/html/wp-content/plugins/brasth-document-sync-for-google-docs/.pnpm-store
      - plugin_vendor:/var/www/html/wp-content/plugins/brasth-document-sync-for-google-docs/vendor
      - ./php/conf.d/docsync-dev.ini:/usr/local/etc/php/conf.d/docsync-dev.ini:ro

  cron:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    command: ["/bin/sh", "/var/www/html/wp-content/plugins/brasth-document-sync-for-google-docs/.devcontainer/scripts/run-cron-worker.sh"]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_USER: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ..:/var/www/html/wp-content/plugins/brasth-document-sync-for-google-docs:cached
      - plugin_node_modules:/var/www/html/wp-content/plugins/brasth-document-sync-for-google-docs/node_modules
      - plugin_pnpm_store:/var/www/html/wp-content/plugins/brasth-document-sync-for-google-docs/.pnpm-store
      - plugin_vendor:/var/www/html/wp-content/plugins/brasth-document-sync-for-google-docs/vendor
      - ./php/conf.d/docsync-dev.ini:/usr/local/etc/php/conf.d/docsync-dev.ini:ro

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: wordpress
      MYSQL_USER: wordpress
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uwordpress -pwordpress --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8091:8080"

volumes:
  plugin_node_modules:
  plugin_pnpm_store:
  plugin_vendor:
  db_data:
  wordpress_data:
