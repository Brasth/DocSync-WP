name: Build Release ZIP (Tag)

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package, for example 1.0.0 or v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-zip:
    name: Build And Package Tagged Release
    runs-on: ubuntu-latest
    env:
      PLUGIN_SLUG: brasth-document-sync-for-google-docs
      RELEASE_TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG_NAME }}

      - name: Validate tag and plugin versions
        id: validate
        run: |
          set -euo pipefail
          TAG_NAME="${RELEASE_TAG_NAME:?Release tag is required.}"

          TAG_VERSION="${TAG_NAME#v}"

          if [ -z "${TAG_VERSION}" ] || ! [[ "${TAG_VERSION}" =~ ^[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a plugin version with optional v prefix. Received: ${TAG_NAME}"
            exit 1
          fi

          PLUGIN_HEADER_VERSION="$(
            awk -F':' '/^[[:space:]]*\*[[:space:]]*Version:/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit}' brasth-document-sync-for-google-docs.php
          )"
          PLUGIN_CONST_VERSION="$(
            sed -nE "s/^define\([[:space:]]*'DOCSYNC_WP_VERSION',[[:space:]]*'([^']+)'.*\);$/\1/p" brasth-document-sync-for-google-docs.php | head -n 1
          )"
          README_STABLE_TAG="$(
            awk -F':' '/^Stable tag:/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit}' readme.txt
          )"

          if [ -z "${PLUGIN_HEADER_VERSION}" ] || [ -z "${PLUGIN_CONST_VERSION}" ] || [ -z "${README_STABLE_TAG}" ]; then
            echo "Could not parse plugin version metadata from brasth-document-sync-for-google-docs.php and readme.txt."
            exit 1
          fi

          if [ "${PLUGIN_HEADER_VERSION}" != "${PLUGIN_CONST_VERSION}" ]; then
            echo "Plugin header version (${PLUGIN_HEADER_VERSION}) does not match DOCSYNC_WP_VERSION (${PLUGIN_CONST_VERSION})."
            exit 1
          fi

          if [ "${PLUGIN_HEADER_VERSION}" != "${README_STABLE_TAG}" ]; then
            echo "Plugin header version (${PLUGIN_HEADER_VERSION}) does not match readme.txt Stable tag (${README_STABLE_TAG})."
            exit 1
          fi

          if [ "${TAG_VERSION}" != "${PLUGIN_HEADER_VERSION}" ]; then
            echo "Tag version from ${TAG_NAME} (${TAG_VERSION}) does not match plugin version (${PLUGIN_HEADER_VERSION})."
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install production PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm build

      - name: Stage distribution files
        id: stage
        run: |
          set -euo pipefail
          STAGING_DIR="${RUNNER_TEMP}/${PLUGIN_SLUG}-package"
          RSYNC_EXCLUDES="${RUNNER_TEMP}/distignore-rsync.txt"
          rm -rf "${STAGING_DIR}"
          mkdir -p "${STAGING_DIR}/${PLUGIN_SLUG}"
          sed 's|^/||' .distignore > "${RSYNC_EXCLUDES}"
          printf '%s\n' '*.zip' >> "${RSYNC_EXCLUDES}"
          rsync -a ./ "${STAGING_DIR}/${PLUGIN_SLUG}/" --exclude-from="${RSYNC_EXCLUDES}"
          echo "staging_dir=${STAGING_DIR}" >> "${GITHUB_OUTPUT}"

      - name: Validate installable plugin layout
        run: |
          set -euo pipefail
          STAGING_DIR="${{ steps.stage.outputs.staging_dir }}"
          PLUGIN_DIR="${STAGING_DIR}/${PLUGIN_SLUG}"

          test -f "${PLUGIN_DIR}/${PLUGIN_SLUG}.php"
          test -f "${PLUGIN_DIR}/vendor/autoload.php"
          test -f "${PLUGIN_DIR}/build/manifest.json"
          test -f "${PLUGIN_DIR}/readme.txt"
          test -d "${PLUGIN_DIR}/build"
          test -d "${PLUGIN_DIR}/resources"
          grep -q "Plugin Name:" "${PLUGIN_DIR}/${PLUGIN_SLUG}.php"

      - name: Create release ZIP
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.validate.outputs.version }}"
          STAGING_DIR="${{ steps.stage.outputs.staging_dir }}"
          DIST_DIR="${RUNNER_TEMP}/${PLUGIN_SLUG}-dist"
          ZIP_NAME="${PLUGIN_SLUG}-v${VERSION}.zip"
          ZIP_PATH="${DIST_DIR}/${ZIP_NAME}"

          rm -rf "${DIST_DIR}"
          mkdir -p "${DIST_DIR}"

          (
            cd "${STAGING_DIR}"
            zip -qr "${ZIP_PATH}" "${PLUGIN_SLUG}"
          )

          echo "zip_name=${ZIP_NAME}" >> "${GITHUB_OUTPUT}"
          echo "zip_path=${ZIP_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Validate release ZIP contents
        run: |
          set -euo pipefail
          ZIP_PATH="${{ steps.package.outputs.zip_path }}"
          ZIP_LIST="${RUNNER_TEMP}/release-zip-list.txt"
          unzip -Z1 "${ZIP_PATH}" > "${ZIP_LIST}"

          TOP_LEVELS="$(awk -F/ 'NF {print $1}' "${ZIP_LIST}" | sort -u)"
          if [ "${TOP_LEVELS}" != "${PLUGIN_SLUG}" ]; then
            echo "ZIP must contain exactly one top-level ${PLUGIN_SLUG}/ directory."
            echo "${TOP_LEVELS}"
            exit 1
          fi

          REQUIRED_FILES=(
            "${PLUGIN_SLUG}/${PLUGIN_SLUG}.php"
            "${PLUGIN_SLUG}/vendor/autoload.php"
            "${PLUGIN_SLUG}/build/manifest.json"
            "${PLUGIN_SLUG}/readme.txt"
          )

          for required_file in "${REQUIRED_FILES[@]}"; do
            if ! grep -Fxq "${required_file}" "${ZIP_LIST}"; then
              echo "ZIP is missing required file: ${required_file}"
              exit 1
            fi
          done

          REQUIRED_DIRS=(
            "${PLUGIN_SLUG}/build/"
            "${PLUGIN_SLUG}/resources/"
          )

          for required_dir in "${REQUIRED_DIRS[@]}"; do
            if ! grep -Fq "${required_dir}" "${ZIP_LIST}"; then
              echo "ZIP is missing required directory: ${required_dir}"
              exit 1
            fi
          done

          FORBIDDEN_PATHS=(
            "${PLUGIN_SLUG}/.git"
            "${PLUGIN_SLUG}/.github"
            "${PLUGIN_SLUG}/.claude"
            "${PLUGIN_SLUG}/.agents"
            "${PLUGIN_SLUG}/.codex"
            "${PLUGIN_SLUG}/node_modules"
            "${PLUGIN_SLUG}/.pnpm-store"
            "${PLUGIN_SLUG}/docs"
            "${PLUGIN_SLUG}/plans"
            "${PLUGIN_SLUG}/tests"
            "${PLUGIN_SLUG}/coverage"
            "${PLUGIN_SLUG}/phpcs.xml.dist"
            "${PLUGIN_SLUG}/assets"
          )

          for forbidden_path in "${FORBIDDEN_PATHS[@]}"; do
            if grep -Fq "${forbidden_path}/" "${ZIP_LIST}" || grep -Fxq "${forbidden_path}" "${ZIP_LIST}"; then
              echo "ZIP contains excluded development path: ${forbidden_path}"
              exit 1
            fi
          done

          if grep -Eiq '\.zip$' "${ZIP_LIST}"; then
            echo "ZIP contains a nested ZIP file."
            grep -Ei '\.zip$' "${ZIP_LIST}"
            exit 1
          fi

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Upload GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.validate.outputs.tag_name }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: gh release upload "${TAG_NAME}" "${ZIP_PATH}" --clobber
