name: Build Release ZIP (Tag)

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package, for example 1.0.0 or v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-zip:
    name: Build And Package Tagged Release
    runs-on: ubuntu-latest
    env:
      PLUGIN_SLUG: brasth-document-sync-for-google-docs
      RELEASE_TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG_NAME }}

      - name: Resolve release metadata
        id: release
        run: |
          set -euo pipefail
          TAG_NAME="${RELEASE_TAG_NAME:?Release tag is required.}"
          VERSION="$(
            awk -F':' '/^[[:space:]]*\*[[:space:]]*Version:/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit}' brasth-document-sync-for-google-docs.php
          )"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install production PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm build

      - name: Build installable ZIP
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          ./scripts/build-zip.sh "${RUNNER_TEMP}"
          ZIP_NAME="${PLUGIN_SLUG}-v${VERSION}.zip"
          ZIP_PATH="${RUNNER_TEMP}/${ZIP_NAME}"
          echo "zip_name=${ZIP_NAME}" >> "${GITHUB_OUTPUT}"
          echo "zip_path=${ZIP_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Upload GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: gh release upload "${TAG_NAME}" "${ZIP_PATH}" --clobber
