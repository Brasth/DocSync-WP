name: Build Release ZIP (Tag)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-zip:
    name: Build And Package Tagged Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag and plugin versions
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          PLUGIN_HEADER_VERSION="$(
            awk -F':' '/^[[:space:]]*\*[[:space:]]*Version:/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit}' docsync-wp.php
          )"
          PLUGIN_CONST_VERSION="$(
            sed -nE "s/^define\([[:space:]]*'DOCSYNC_WP_VERSION',[[:space:]]*'([^']+)'.*\);$/\1/p" docsync-wp.php | head -n 1
          )"

          if [ -z "${PLUGIN_HEADER_VERSION}" ] || [ -z "${PLUGIN_CONST_VERSION}" ]; then
            echo "Could not parse plugin versions from docsync-wp.php."
            exit 1
          fi

          if [ "${PLUGIN_HEADER_VERSION}" != "${PLUGIN_CONST_VERSION}" ]; then
            echo "Plugin header version (${PLUGIN_HEADER_VERSION}) does not match DOCSYNC_WP_VERSION (${PLUGIN_CONST_VERSION})."
            exit 1
          fi

          if [ "${TAG_VERSION}" != "${PLUGIN_HEADER_VERSION}" ]; then
            echo "Tag version (${TAG_VERSION}) does not match plugin version (${PLUGIN_HEADER_VERSION})."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install production PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm build

      - name: Stage distribution files
        id: stage
        run: |
          set -euo pipefail
          PLUGIN_SLUG="docsync-wp"
          STAGING_DIR="${RUNNER_TEMP}/${PLUGIN_SLUG}-package"
          RSYNC_EXCLUDES="${RUNNER_TEMP}/distignore-rsync.txt"
          mkdir -p "${STAGING_DIR}/${PLUGIN_SLUG}"
          sed 's|^/||' .distignore > "${RSYNC_EXCLUDES}"
          rsync -a ./ "${STAGING_DIR}/${PLUGIN_SLUG}/" --exclude-from="${RSYNC_EXCLUDES}"
          echo "staging_dir=${STAGING_DIR}" >> "${GITHUB_OUTPUT}"

      - name: Create plugin ZIP
        id: archive
        run: |
          set -euo pipefail
          PLUGIN_SLUG="docsync-wp"
          ARCHIVE_NAME="${PLUGIN_SLUG}-${GITHUB_REF_NAME}.zip"
          cd "${{ steps.stage.outputs.staging_dir }}"
          zip -r "${ARCHIVE_NAME}" "${PLUGIN_SLUG}"
          echo "archive_name=${ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "archive_path=${{ steps.stage.outputs.staging_dir }}/${ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.archive_name }}
          path: ${{ steps.archive.outputs.archive_path }}
          if-no-files-found: error
