name: Build Snapshot ZIP

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-zip:
    name: Build And Package Snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install production PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm build

      - name: Build and stage installable plugin
        id: stage
        run: |
          set -euo pipefail
          PLUGIN_SLUG="brasth-document-sync-for-google-docs"
          STAGING_DIR="${RUNNER_TEMP}/${PLUGIN_SLUG}-package"
          ./scripts/build-zip.sh "${RUNNER_TEMP}"
          unzip -q "${RUNNER_TEMP}/${PLUGIN_SLUG}-"*.zip -d "${STAGING_DIR}"
          echo "staging_dir=${STAGING_DIR}" >> "${GITHUB_OUTPUT}"

      - name: Validate installable plugin layout
        run: |
          set -euo pipefail
          PLUGIN_SLUG="brasth-document-sync-for-google-docs"
          STAGING_DIR="${{ steps.stage.outputs.staging_dir }}"
          test -f "${STAGING_DIR}/${PLUGIN_SLUG}/${PLUGIN_SLUG}.php"
          test -f "${STAGING_DIR}/${PLUGIN_SLUG}/vendor/autoload.php"
          REQUIRED_BUILD_MANIFESTS=(
            manifest.setup.json
            manifest.sources.json
            manifest.logs.json
            manifest.post-sync.json
            manifest.doc-source-modal.json
            manifest.drive-browser.json
          )
          for manifest in "${REQUIRED_BUILD_MANIFESTS[@]}"; do
            test -f "${STAGING_DIR}/${PLUGIN_SLUG}/build/${manifest}"
          done
          grep -q "Plugin Name:" "${STAGING_DIR}/${PLUGIN_SLUG}/${PLUGIN_SLUG}.php"
          FORBIDDEN_PATHS=(assets .claude .agents .codex)
          for forbidden_path in "${FORBIDDEN_PATHS[@]}"; do
            if [ -e "${STAGING_DIR}/${PLUGIN_SLUG}/${forbidden_path}" ]; then
              echo "Installable artifact must not contain ${forbidden_path}."
              exit 1
            fi
          done

      - name: Upload installable plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: brasth-document-sync-for-google-docs-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ steps.stage.outputs.staging_dir }}/brasth-document-sync-for-google-docs
          if-no-files-found: error
