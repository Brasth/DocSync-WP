name: Deploy to WordPress.org SVN

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy, for example 1.0.4 or v1.0.4"
        required: true
        type: string
      dry_run:
        description: "Build the ZIP without committing to SVN"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    env:
      PLUGIN_SLUG: brasth-document-sync-for-google-docs
      RELEASE_TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG_NAME }}

      - name: Resolve release version
        run: |
          set -euo pipefail
          VERSION="$(
            awk -F':' '/^[[:space:]]*\*[[:space:]]*Version:/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit}' brasth-document-sync-for-google-docs.php
          )"
          echo "version=${VERSION}" >> "${GITHUB_ENV}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install production PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm build

      - name: Build installable ZIP for dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        id: package
        run: |
          set -euo pipefail
          ./scripts/build-zip.sh "${RUNNER_TEMP}"
          echo "zip_path=${RUNNER_TEMP}/${PLUGIN_SLUG}-v${version}.zip" >> "${GITHUB_OUTPUT}"

      - name: Deploy to WordPress.org
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: brasth-document-sync-for-google-docs
          ASSETS_DIR: assets
          VERSION: ${{ env.version }}
