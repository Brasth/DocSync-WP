name: PR Lint

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Lint (PHPCS)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.1"
          - "8.2"
          - "8.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Audit Composer dependencies
        run: composer audit

      - name: Verify PHPCS standards
        run: |
          standards="$(vendor/bin/phpcs -i)"
          echo "$standards"

          for standard in WordPress WordPress-Core WordPress-Docs WordPress-Extra PHPCompatibilityWP; do
            if ! grep -Fq "$standard" <<< "$standards"; then
              echo "Missing PHPCS standard: $standard"
              exit 1
            fi
          done

      - name: Run PHPCS
        run: composer lint

      - name: Verify layout fixtures
        run: composer test:layout-fixtures

      - name: Verify Elementor fixtures
        run: composer test:elementor-fixtures

      - name: Verify large-document fallback fixtures
        run: composer test:large-doc-fallback-fixtures

      - name: Verify telemetry settings fixtures
        run: composer test:telemetry-settings

      - name: Run PHPCompatibility for PHP 8.1
        run: vendor/bin/phpcs --standard=PHPCompatibilityWP --runtime-set testVersion 8.1- --report=summary brasth-document-sync-for-google-docs.php src uninstall.php

      - name: Validate WordPress.org readme metadata
        run: |
          set -euo pipefail

          TAGS_LINE="$(awk -F':' '/^Tags:/ {print $2; exit}' readme.txt)"
          TAG_COUNT="$(awk -v tags="${TAGS_LINE}" 'BEGIN {gsub(/^[[:space:]]+|[[:space:]]+$/, "", tags); if (tags == "") {print 0; exit} print split(tags, parts, /,[[:space:]]*/)}')"

          if [ "${TAG_COUNT}" -gt 5 ]; then
            echo "readme.txt must list no more than 5 WordPress.org tags. Found ${TAG_COUNT}."
            exit 1
          fi

          if ! grep -Fq "== Source And Build Instructions ==" readme.txt; then
            echo "readme.txt must document source and build instructions for bundled assets."
            exit 1
          fi

  js-lint:
    name: JS/TS Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Node dependencies
        run: pnpm audit

      - name: Run ESLint
        run: pnpm lint

      - name: Run screenshot sync lint
        run: pnpm lint:screenshots

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run telemetry Worker tests
        run: pnpm --dir cloudflare/telemetry-worker lint && pnpm --dir cloudflare/telemetry-worker test

      - name: Run feedback Worker tests
        run: pnpm --dir cloudflare/feedback-worker lint && pnpm --dir cloudflare/feedback-worker test

      - name: Build frontend assets
        run: pnpm build
