name: PR Lint

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches-ignore:
      - main

jobs:
  php-lint:
    name: PHP Lint (PHPCS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Verify PHPCS standards
        run: |
          standards="$(vendor/bin/phpcs -i)"
          echo "$standards"

          for standard in WordPress WordPress-Core WordPress-Docs WordPress-Extra PHPCompatibilityWP; do
            if ! grep -Fq "$standard" <<< "$standards"; then
              echo "Missing PHPCS standard: $standard"
              exit 1
            fi
          done

      - name: Run PHPCS
        run: composer lint

  js-lint:
    name: JS/TS Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint
