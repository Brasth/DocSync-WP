<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500" role="img" aria-labelledby="title desc">
  <title id="title">Brasth Document Sync for Google Docs banner</title>
  <desc id="desc">A dark WordPress.org banner for Brasth Document Sync with a glowing cloud document icon and tagline.</desc>
  <defs>
    <linearGradient id="bg-banner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cloud-banner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="1544" height="500" fill="url(#bg-banner)"/>
  <path d="M0 420 Q200 360 400 420 T800 440 T1200 400 T1544 430 V500 H0 Z" fill="url(#wave)"/>
  <path d="M0 460 Q250 400 500 460 T1000 480 T1544 450 V500 H0 Z" fill="url(#wave)" opacity="0.5"/>
  <g transform="translate(1250, 250)">
    <path d="M-90 20C-90 -35 -50 -75 5 -75C35 -75 60 -55 75 -30C105 -35 130 -5 130 30C130 70 95 100 50 100H-40C-75 100 -90 65 -90 20Z" fill="url(#cloud-banner)"/>
    <rect x="-45" y="-55" width="90" height="110" rx="8" fill="#F8FAFC"/>
    <path d="M30 -55V-35H50L30 -55Z" fill="#CBD5E1"/>
    <circle cx="0" cy="-5" r="24" fill="#2563EB"/>
    <path d="M-11 12L-6 -10L0 0L6 -10L11 12" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-12" cy="-5" r="2.5" fill="white"/>
    <circle cx="12" cy="-5" r="2.5" fill="white"/>
    <rect x="-30" y="35" width="60" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="-30" y="50" width="44" height="7" rx="3.5" fill="#CBD5E1"/>
  </g>
  <text x="80" y="200" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#F8FAFC">Brasth Document Sync</text>
  <text x="80" y="275" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#F8FAFC">for Google Docs</text>
  <text x="80" y="360" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#22D3EE">Sync Google Docs into WordPress</text>
</svg>
